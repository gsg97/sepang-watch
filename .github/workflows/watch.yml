name: sepang-ticket-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sepang-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Persist state
        run: |
          git config user.name "sepang-watch"
          git config user.email "actions@github.com"

          cp state.json /tmp/state.json

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json state.json
            git add state.json

            if git diff --staged --quiet; then
              echo "no state change, nothing to push"
              exit 0
            fi

            git commit -m "state update [skip ci]"

            if git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            echo "push rejected, remote moved ahead. retrying in 5s"
            sleep 5
          done

          echo "::warning::could not persist state after 5 attempts"
          exit 0
